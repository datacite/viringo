services:
  web:
    build: .
    # Explicit name so CI can pre-build the image with buildx and the GitHub
    # Actions cache, then start it without rebuilding.
    image: viringo-web
    ports:
      - "8091:80"
      - "2291:22"
    environment:
      # `FLASK_DEBUG=1 docker compose up` enables Flask debug mode, installs
      # the dev dependencies and reloads the app when the source changes.
      - FLASK_DEBUG
    volumes:
      - ./:/home/app/webapp
