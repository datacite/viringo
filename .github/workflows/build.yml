name: Build and Push
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    inputs:
      image_tag:
        description: Tag to push to Docker Hub and GHCR
        required: true
        type: string

env:
  # Must match pull_reqest.yml so this build reuses the test job's cached layers.
  UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Compute weekly apt cache-bust key
        id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Staging pulls datacite/viringo:latest from Docker Hub; production pulls
      # ghcr.io/datacite/viringo:<release tag>. Push both from a single build.
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ github.repository }}:${{ inputs.image_tag }}
            ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
          build-args: |
            UBUNTU_MIRROR=${{ env.UBUNTU_MIRROR }}
            APT_CACHE_BUST=${{ steps.week.outputs.key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
