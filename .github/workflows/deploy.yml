name: Deploy to Staging
on:
  push:
    branches:
      - "master"

permissions:
  contents: read

# Don't let two merges race each other into the terraform repo.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/pull_reqest.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      image_tag: latest
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/_update_terraform.yml
    with:
      deployment_environment: staging
    secrets: inherit
