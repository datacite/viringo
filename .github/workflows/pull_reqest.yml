name: CI Test
on:
  pull_request:
    branches:
      - master
  # Also run as the test gate in deploy.yml and release.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the stack
        run: docker compose -f docker-compose.yml up -d --build
      - name: Run Tests
        run: docker compose -f docker-compose.yml exec -T web ./bin/ci.sh
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down
