name: CI Test
on:
  pull_request:
    branches:
      - master
  # Also run as the test gate in deploy.yml and release.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the stack
        run: docker compose -f docker-compose.yml up -d --build
      - name: Run Tests
        run: docker compose -f docker-compose.yml exec -T web ./bin/ci.sh
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down

  audit:
    # Only on pull requests: a newly published advisory should be flagged for
    # review, not block an urgent deploy or release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export locked requirements
        run: pipx run pipenv requirements --dev > "$RUNNER_TEMP/requirements.txt"
      - name: Audit Python dependencies
        run: pipx run pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
