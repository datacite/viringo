# Version updates. Security updates for vulnerable dependencies are enabled
# separately in the repository settings (Dependabot alerts / security updates).
version: 2
updates:
  # Pipfile / Pipfile.lock
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Base image in the Dockerfile (phusion/passenger-python314)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
