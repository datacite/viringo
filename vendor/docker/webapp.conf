server {
    listen 80 default_server;
    server_name _;

    # nginx serves files that exist here (e.g. /favicon.ico); everything else
    # goes to the app.
    root /home/app/webapp/viringo/static;

    passenger_enabled on;
    passenger_user app;
    passenger_python /home/app/venv/bin/python;
    passenger_app_root /home/app/webapp/;
    # 20_always_restart.sh creates tmp/always_restart.txt here in development.
    passenger_restart_dir /home/app/webapp/tmp;
    passenger_app_type wsgi;
    passenger_startup_file viringo/wsgi.py;

    include /etc/nginx/conf.d/cors.conf;
}
